[project]
name = "estoca-backend"
version = "0.1.0"
description = "Backend do mini ERP de estoque Estoca"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.19.1,<2.0.0",
    "asyncpg>=0.31.0,<0.32.0",
    "fastapi>=0.141.1,<0.142.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",
    "pwdlib[bcrypt]>=0.3.1,<0.4.0",
    "sqlalchemy[asyncio]>=2.0.52,<3.0.0",
    "uvicorn[standard]>=0.52.4,<0.53.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
cache_dir = "/tmp/pytest_cache"
pythonpath = ["."]
testpaths = ["tests"]
